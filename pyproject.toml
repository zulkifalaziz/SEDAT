[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sedat-tokenizer"
version = "1.0.0"
description = "SE-DAGAF Adaptive Tokenizer (SEDAT) for large EEG foundation models"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Muhammad Zulkifal Aziz" },
    { name = "Zhuo Yue" },
    { name = "Huang Binwen" },
    { name = "Yu Xiaojun" },
]
keywords = ["eeg", "tokenization", "signal-processing", "brain-computer-interface", "foundation-models"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
labram = ["torch>=2.0", "scikit-learn>=1.3", "matplotlib>=3.7"]
dev = ["pytest>=7.4", "matplotlib>=3.7", "torch>=2.0", "scikit-learn>=1.3"]

[tool.setuptools.packages.find]
include = ["sedat*", "labram*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
